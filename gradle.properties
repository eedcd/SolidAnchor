kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true

# Gradle settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
# ZGC from JDK 21
# TLS 1.3 is rejected by this network path, so the daemon must fall back to TLS 1.2.
org.gradle.jvmargs=-Xms1024m -Xmx4096m -XX:+UseZGC -Djdk.tls.client.protocols=TLSv1.2

org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers

# Mod Properties
mod_version=0.1.1
mod_mc_version=>26.2 <26.4
maven_group=com.github.eedcd.solidanchor
archives_base_name=solidanchor
